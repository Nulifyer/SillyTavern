<form action="javascript:void(0);" class="flex-container flexFlowColumn">
    <div class="currentPasswordBlock">
        <label data-i18n="Current Password:" for="change_password_current">Current Password:</label>
        <input id="change_password_current" type="password" name="current" class="text_pole" placeholder="[ No password ]" autocomplete="current-password">
    </div>
    <div class="newPasswordBlock">
        <label data-i18n="New Password:" for="change_password_new">New Password:</label>
        <input id="change_password_new" type="password" name="password" class="text_pole" placeholder="[ No password ]" autocomplete="new-password">
    </div>
    <div class="confirmPasswordBlock">
        <label data-i18n="Confirm New Password:" for="change_password_confirm">Confirm New Password:</label>
        <input id="change_password_confirm" type="password" name="confirm" class="text_pole" placeholder="[ No password ]" autocomplete="new-password">
    </div>
</form>
