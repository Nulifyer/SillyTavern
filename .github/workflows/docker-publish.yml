name: Publish release container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to rebuild
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Serialize publishes so a retry cannot race another release's latest tag.
concurrency:
  group: container-releases
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.release.outputs.image }}
      latest: ${{ steps.release.outputs.latest }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate published release and select image tags
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Release tag must be a valid container tag: $RELEASE_TAG" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          jq -e '.draft == false and .published_at != null' "$RUNNER_TEMP/release.json" > /dev/null
          latest=false
          if [[ "$(jq -r '.prerelease' "$RUNNER_TEMP/release.json")" == false ]]; then
            latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
            if [[ "$latest_tag" == "$RELEASE_TAG" ]]; then
              latest=true
            fi
          fi
          echo "image=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Record the tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      COMMIT: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the native architecture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.COMMIT }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,scope=release-${{ matrix.arch }},mode=max

      - name: Verify native server startup
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --detach --name sillytavern-release-smoke \
            --env SILLYTAVERN_HEARTBEATINTERVAL=5 "$IMAGE@$DIGEST" --browserLaunchEnabled false
          ready=false
          for attempt in $(seq 1 40); do
            echo "Checking server startup ($attempt/40)"
            if docker exec sillytavern-release-smoke node --input-type=module -e '
              const response = await fetch("http://127.0.0.1:8000/");
              const html = await response.text();
              if (response.status !== 200 || !html.includes("workspace-sidebar")) process.exit(1);
            ' > /dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs sillytavern-release-smoke
            exit 1
          fi
          docker exec sillytavern-release-smoke node src/healthcheck.js

      - name: Remove smoke test container
        if: always()
        run: docker rm --force sillytavern-release-smoke > /dev/null 2>&1 || true

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      COMMIT: ${{ needs.prepare.outputs.sha }}
      LATEST: ${{ needs.prepare.outputs.latest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and verify the multiarch release index
        run: |
          set -euo pipefail
          tags=(--tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:sha-$COMMIT")
          if [[ "$LATEST" == true ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:sha-$COMMIT-amd64" "$IMAGE:sha-$COMMIT-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" \
            --format '{{json .Manifest}}' > "$RUNNER_TEMP/image-index.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | contains(["amd64", "arm64"])' "$RUNNER_TEMP/image-index.json"
          digest=$(jq -r '.digest' "$RUNNER_TEMP/image-index.json")
          {
            echo "### Published container"
            echo
            echo "Release: \`$RELEASE_TAG\`"
            echo "Commit: \`$COMMIT\`"
            echo "Native build and startup checks: amd64, arm64"
            echo
            echo '```text'
            echo "$IMAGE:$RELEASE_TAG"
            echo "$IMAGE:sha-$COMMIT"
            if [[ "$LATEST" == true ]]; then echo "$IMAGE:latest"; fi
            echo "$IMAGE@$digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
